plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.relicskeybind'

base {
    archivesName = 'relicskeybind'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.20.1'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            
            mods {
                relicskeybind {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'mixins.relicskeybind.refmap.json'
    config 'mixins.relicskeybind.json'
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.blamejared.com" }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    
    // Add Relics mod as compile-only dependency
    compileOnly files('C:/Users/Elias/Documents/Modding/Prism Launcher/instances/Cluster Thrusters/.minecraft/mods/relics-1.20.1-0.8.0.11.jar')
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'Relics Keybind',
            'Specification-Vendor'    : 'RelicsKeybind',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'RelicsKeybind',
            'MixinConfigs'            : 'mixins.relicskeybind.json'
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
